name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension (sanity zip)
        run: npm run package:no-build

      - name: Upload built extension as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error
